# ===========================================================================
# 前端静态资源 + API 反向代理（容器内使用）
# ---------------------------------------------------------------------------
# 注意：这是**容器内**的 Nginx 配置。本机直接跑 `node scripts/serve-dist.mjs 4173`
# 或 `npm run preview` 时不需要它。
# ===========================================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 5m;

    # ---- 压缩：Element Plus 与 ECharts 的产物偏大，gzip 收益明显 ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # ---- 带 hash 的构建产物可以长缓存；index.html 必须不缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---- API 反向代理：前端用同源 /api，避免容器内外地址不一致 ----
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # hash 路由（#/orders），服务端只需要返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
